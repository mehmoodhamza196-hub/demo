<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pizza POS · Live demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8D%95%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f1f3ef;--panel:#fff;--ink:#16231c;--muted:#66736b;--line:#d9ded8;--green:#1d6b47;--green-d:#134a31;--tomato:#c43b2b;--amber:#e0a526;--soft:#e6efe9;--r:10px}
*{box-sizing:border-box}html{font-size:15px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;line-height:1.4;font-variant-numeric:tabular-nums}
h1{font-size:1.5rem;margin:0 0 .6rem}h2{font-size:1.1rem;margin:.2rem 0 .7rem}h3{margin:0 0 .6rem}
.muted{color:var(--muted)}.bad{color:var(--tomato);font-weight:600}.good{color:var(--green);font-weight:600}.r{text-align:right}.c{text-align:center}
.demo{background:var(--amber);color:#2b2000;padding:.4rem 1rem;font-size:.9rem;font-weight:600;display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;align-items:center}
.demo button{font:inherit;font-size:.85rem;background:#2b2000;color:#fff;border:0;border-radius:6px;padding:.15rem .6rem;cursor:pointer}
.top{display:flex;align-items:center;gap:1rem;background:var(--ink);color:#fff;padding:.5rem 1rem;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{font-weight:700;font-size:1.1rem}
.roles{display:flex;gap:.25rem;background:#26382f;border-radius:8px;padding:.2rem;margin-left:auto;align-items:center;flex-wrap:wrap}
.roles span{font-size:.78rem;color:#9fb5a7;padding:0 .5rem}
.roles button{border:0;background:none;color:#cfe0d6;padding:.35rem .8rem;border-radius:6px;cursor:pointer;font:inherit}
.roles button.on{background:var(--green);color:#fff;font-weight:600}
.who{font-size:.85rem;color:#cfe0d6}
.nav{display:flex;gap:.2rem;background:#fff;border-bottom:1px solid var(--line);padding:.35rem 1rem;overflow-x:auto}
.nav button{border:0;background:none;padding:.45rem .85rem;border-radius:7px;cursor:pointer;font:inherit;color:var(--ink);white-space:nowrap}
.nav button:hover{background:var(--soft)}.nav button.on{background:var(--green);color:#fff}
.btn{display:inline-block;border:1px solid var(--line);background:#fff;color:var(--ink);padding:.5rem .9rem;border-radius:8px;cursor:pointer;font:inherit;font-weight:600}
.btn:hover{border-color:#aab5ad}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.primary:hover{background:var(--green-d)}
.btn.danger{background:var(--tomato);border-color:var(--tomato);color:#fff}.btn.small{padding:.3rem .65rem;font-size:.88rem}.btn.wide{width:100%}.btn.big{font-size:1.15rem;padding:.8rem 1rem}.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
input,select{font:inherit;padding:.45rem .6rem;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%;color:var(--ink)}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:.6rem}label>input:not([type=checkbox]),label>select{display:block;margin-top:.2rem}
label.check{display:flex;align-items:center;gap:.45rem;color:var(--ink);font-size:.92rem}label.check input{width:auto;margin:0}
input.short{width:6.5rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;margin-bottom:1rem}
.page{max-width:1150px;margin:1rem auto;padding:0 1rem}.page.narrow{max-width:720px}
table{width:100%;border-collapse:collapse}th,td{padding:.45rem .5rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:.82rem;color:var(--muted);font-weight:600}
th.r,td.r{text-align:right}table.kv td:last-child{text-align:right}table.kv tr.strong td{font-weight:700;font-size:1.05rem}
.scroll{overflow-x:auto}.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.row.between{justify-content:space-between}
.badge{padding:.1rem .55rem;border-radius:20px;font-size:.8rem;background:var(--soft)}.badge.refunded{background:#fbe6e3;color:#8a2418}
.filters{display:flex;gap:.8rem;align-items:flex-end;flex-wrap:wrap;margin-bottom:.8rem}.filters label{margin:0}
.formrow{display:flex;gap:.7rem;align-items:flex-end;flex-wrap:wrap}.formrow label{margin:0}.formrow .grow{flex:1;min-width:170px}.formrow.sub{padding:.55rem 0;border-top:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.8rem;margin-bottom:1rem}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:.8rem 1rem}.stat span{color:var(--muted);font-size:.85rem;display:block}.stat b{font-size:1.45rem}.stat.good b{color:var(--green)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:1rem}.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem}
.bar{display:grid;grid-template-columns:90px 1fr auto;align-items:center;gap:.6rem;margin:.3rem 0}.bar i{display:block;height:14px;background:var(--green);border-radius:3px}
.perms{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:.3rem .9rem;margin:.6rem 0}
.pos{display:grid;grid-template-columns:1fr 410px;height:calc(100vh - 150px);min-height:560px}
.menu-pane{display:flex;flex-direction:column;min-height:0;padding:.8rem}
.shiftbar{display:flex;gap:1.4rem;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:.5rem .9rem;margin-bottom:.7rem}
.shiftbar div{display:flex;flex-direction:column;font-size:.78rem;color:var(--muted)}.shiftbar b{font-size:1.05rem;color:var(--ink)}.shiftbar .drawer b{color:var(--green)}.shiftbar button{margin-left:auto}
.menu-tools{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.7rem}.menu-tools input{max-width:230px}
.cats{display:flex;gap:.4rem;flex-wrap:wrap}.cats button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:.4rem .95rem;cursor:pointer;font:inherit}.cats button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem;overflow:auto;align-content:start;flex:1;padding-bottom:1rem}
.tile{background:#fff;border:1px solid var(--line);border-left:5px solid var(--green);border-radius:var(--r);padding:.8rem;text-align:left;cursor:pointer;font:inherit;min-height:84px}
.tile:hover{border-color:var(--green);box-shadow:0 2px 8px rgba(0,0,0,.08)}.tile b{display:block}.tile span{color:var(--muted);font-size:.85rem}
.tile.c-Pizza{border-left-color:var(--tomato)}.tile.c-Drinks{border-left-color:#2e6f9e}.tile.c-Sides{border-left-color:var(--amber)}
.cart-pane{background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:.7rem}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-bottom:.5rem}.types button{padding:.5rem;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font:inherit;font-weight:600}.types button.on{background:var(--green);color:#fff;border-color:var(--green)}
.custbox{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-bottom:.5rem}.custbox input{padding:.35rem .5rem}.custbox .full{grid-column:1/-1}
.cart{flex:1;overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);min-height:100px}
.line{display:grid;grid-template-columns:1fr auto auto;gap:.5rem;align-items:center;padding:.5rem .1rem;border-bottom:1px dashed var(--line)}.line small{display:block;color:var(--muted)}
.qty{display:flex;align-items:center;gap:.3rem}.qty button{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:1rem}.line .x{border:0;background:none;color:var(--tomato);cursor:pointer;font-size:1.1rem}
.empty{color:var(--muted);text-align:center;padding:2rem 0}
.onote{margin:.5rem 0 .3rem;padding:.35rem .5rem}.discount{display:grid;grid-template-columns:auto 70px 1fr;gap:.4rem;align-items:center;margin:.2rem 0}.discount label{margin:0}
.totals div{display:flex;justify-content:space-between;padding:.1rem 0}.totals .grand{font-size:1.5rem;font-weight:700;border-top:2px solid var(--ink);margin-top:.3rem;padding-top:.3rem}.totals .warn{color:var(--tomato);font-size:.85rem}
.cart-actions{display:grid;grid-template-columns:1fr 1.15fr 1fr 1.5fr;gap:.4rem;margin-top:.4rem}.cart-actions .btn{white-space:nowrap;padding-left:.4rem;padding-right:.4rem}
.modal{position:fixed;inset:0;background:rgba(20,30,25,.55);display:grid;place-items:center;z-index:50;padding:1rem}.modal.hidden{display:none}
.modal-box{background:#fff;border-radius:12px;padding:1.2rem;width:100%;max-width:470px;max-height:92vh;overflow:auto}.modal-box.wide{max-width:640px}
.opt{display:flex;align-items:center;gap:.5rem;padding:.5rem .6rem;border:1px solid var(--line);border-radius:8px;margin-bottom:.4rem;color:var(--ink);font-size:1rem;cursor:pointer}.opt input{width:auto;margin:0}.opt b{margin-left:auto}
.actions{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem}
.due{font-size:1.1rem;display:flex;justify-content:space-between;margin-bottom:.6rem}.due b{font-size:1.7rem}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-bottom:.8rem}
.pinfo{background:var(--soft);padding:.6rem .8rem;border-radius:8px;margin-top:.4rem}.pinfo.err{background:#fbe6e3;color:#8a2418}
.done{text-align:center}.done .tick{font-size:2.4rem;color:var(--green)}.done .chg{font-size:1.6rem;font-weight:700;color:#a87400}
.heldrow{display:flex;justify-content:space-between;gap:.5rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--line)}
.rc{width:302px;margin:0 auto;background:#fff;padding:12px;font-family:"Courier New",monospace;font-size:13px;color:#000;border:1px dashed #bbb}
.rc h2{text-align:center;margin:0 0 4px;font-size:18px}.rc hr{border:0;border-top:1px dashed #000;margin:7px 0}.rc .l{display:flex;justify-content:space-between;gap:8px;padding:1px 0}
.rc .sub{padding-left:14px;font-size:12px}.rc .total{font-size:16px;font-weight:700;border-top:1px solid #000;margin-top:4px;padding-top:4px}.rc .big{font-size:42px;font-weight:700;text-align:center}.rc .stamp{text-align:center;font-size:22px;font-weight:700;border:2px solid #000;margin:8px 0;padding:4px}
.rc.kitchen{font-size:16px}.rc .kl{padding:4px 0;font-size:17px}.c-t{text-align:center}
.toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1rem;border-radius:8px;z-index:90;font-size:.95rem}
.lock{max-width:560px;margin:3rem auto;text-align:center}
@media print{body *{visibility:hidden}#receipt,#receipt *{visibility:visible}#receipt{position:absolute;left:0;top:0;border:0}}
@media(max-width:900px){.pos{grid-template-columns:1fr;height:auto}.cart-pane{border-left:0;border-top:2px solid var(--line)}.roles{margin-left:0}}
</style>

<body>
<div id="app"></div>
<div id="modal" class="modal hidden"><div class="modal-box" id="mbox"></div></div>
<script>
(() => {
"use strict";
const KEY = "pizzaDemo.v2", DAY = 864e5;
const $ = (s, e = document) => e.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const isoDay = ts => { const d = new Date(ts); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const dKey = ts => isoDay(ts).replace(/-/g, "");
const hm = ts => { const d = new Date(ts); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const stamp = ts => isoDay(ts) + " " + hm(ts);
const day0 = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
const fmt = n => { n = Number(n) || 0; const w = Math.abs(n - Math.round(n)) < .005; return n.toLocaleString("en-US", { minimumFractionDigits: w ? 0 : 2, maximumFractionDigits: w ? 0 : 2 }); };
const r2 = n => Math.round(n * 100) / 100;
const orderCode = o => dKey(o.ts) + "-" + String(o.no).padStart(3, "0");
const TYPES = { dine_in: "Dine-in", takeaway: "Takeaway", delivery: "Delivery" };

const PERMS = [
  ["take_order", "Cashier: open shift, take orders, hold orders, take payments, print bills"],
  ["apply_discount", "Cashier: give discounts up to the cashier limit"],
  ["discount_override", "Give discounts above the cashier limit"],
  ["view_own_orders", "View own orders (today only)"],
  ["view_all_orders", "View all orders, any date"],
  ["refund_orders", "Refund orders"],
  ["manage_inventory", "Ingredients, stock-in, wastage and stock count"],
  ["manage_menu", "Add and edit menu items, prices, add-ons and recipes"],
  ["view_reports", "See the dashboard and today's sales report"],
  ["view_reports_full", "Reports for any date range and CSV export"],
  ["view_profit", "See cost and profit figures"],
  ["view_all_shifts", "See every cashier's shift and cash difference"],
  ["manage_roles", "Assign permission tokens to roles"],
  ["manage_settings", "Change shop details, tax and limits"],
  ["view_audit", "View the audit log"]
];
const CASHIER = ["take_order", "apply_discount", "view_own_orders"];
const MANAGER = CASHIER.concat(["discount_override", "view_all_orders", "refund_orders", "manage_inventory", "manage_menu", "view_reports", "view_all_shifts"]);
const NAV = [
  ["pos", "Billing", ["take_order"]], ["shift", "My shift", ["take_order"]], ["orders", "Orders", ["view_own_orders", "view_all_orders"]],
  ["dash", "Dashboard", ["view_reports"]], ["reports", "Sales reports", ["view_reports"]], ["shifts", "Cashier shifts", ["view_all_shifts"]],
  ["menu", "Menu and recipes", ["manage_menu"]], ["inventory", "Inventory", ["manage_inventory"]], ["roles", "Roles and tokens", ["manage_roles"]],
  ["settings", "Settings", ["manage_settings"]], ["audit", "Audit log", ["view_audit"]]
];

let S, ui = { view: null, cat: "All", cart: [], type: "dine_in", table: "", name: "", phone: "", addr: "", note: "", dtype: "percent", dval: "", search: "",
              from: null, to: null, ofrom: null, oto: null, oq: "", ostatus: "", shiftId: null, heldId: null };
let memory = null;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { memory = JSON.stringify(S); } };

/* ---------- data: seed ---------- */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function seedData() {
  const R = rng(11), pick = a => a[Math.floor(R() * a.length)], wpick = (a, w) => { let x = R() * w.reduce((s, v) => s + v, 0); for (let i = 0; i < a.length; i++) { x -= w[i]; if (x < 0) return a[i]; } return a[a.length - 1]; };
  const now = Date.now(), today0 = day0(now);
  const s = { v: 2, role: "cashier", settings: { shop: "Roma Pizza House", address: "Main Boulevard, Islamabad", phone: "0300-1234567", currency: "Rs", taxName: "GST", taxRate: 16, maxDiscount: 10, requireShift: true, footer: "Thank you! See you again." },
    roles: { cashier: { name: "Cashier", user: "Ahmed Khan", perms: CASHIER.slice() }, manager: { name: "Manager", user: "Bilal Raza", perms: MANAGER.slice() }, owner: { name: "Owner", user: "Imran Sheikh", admin: true, perms: [] } },
    menu: [], addons: [], ing: [], rec: {}, arec: {}, orders: [], shifts: [], held: [], log: [], audit: [], id: { order: 1, shift: 1, item: 1, v: 1, ing: 1, addon: 1 }, anchor: today0 - DAY };
  const ING = {};
  [["Dough", "g", 20000, 5000, .25], ["Pizza sauce", "g", 8000, 2000, .5], ["Mozzarella cheese", "g", 15000, 4000, 1.8], ["Chicken", "g", 10000, 2000, 1.2], ["Pepperoni", "g", 4000, 1000, 2.5],
   ["Olives", "g", 2000, 500, 1.5], ["Jalapenos", "g", 1500, 400, 1], ["Pizza box", "pcs", 300, 50, 40], ["Cola 345ml", "pcs", 120, 24, 55], ["Water bottle", "pcs", 100, 24, 30],
   ["Potato fries", "g", 8000, 2000, .35], ["Garlic bread", "pcs", 60, 15, 40]].forEach(([name, unit, stock, reorder, cost]) => { const id = s.id.ing++; ING[name] = id; s.ing.push({ id, name, unit, stock, reorder, cost }); });
  const item = (cat, name, addons, vars) => { const it = { id: s.id.item++, cat, name, addons, active: true, variants: [] }; vars.forEach(([label, price, recipe]) => { const v = { id: s.id.v++, label, price }; it.variants.push(v); s.rec[v.id] = {}; Object.entries(recipe).forEach(([k, q]) => s.rec[v.id][ING[k]] = q); }); s.menu.push(it); };
  const base = { S: [150, 50, 80], M: [250, 80, 140], L: [350, 110, 200] };
  const pizza = (name, prices, top) => item("Pizza", name, true, [["Small", "S", 1], ["Medium", "M", 1.7], ["Large", "L", 2.3]].map(([label, k, m], i) => { const [d, sa, ch] = base[k], r = { "Dough": d, "Pizza sauce": sa, "Mozzarella cheese": ch, "Pizza box": 1 }; if (top) r[top[0]] = top[1] * m; return [label, prices[i], r]; }));
  pizza("Margherita", [550, 950, 1300]); pizza("Pepperoni", [650, 1150, 1500], ["Pepperoni", 30]); pizza("Chicken Fajita", [650, 1100, 1450], ["Chicken", 60]); pizza("BBQ Chicken Tikka", [650, 1100, 1450], ["Chicken", 60]);
  item("Sides", "Garlic Bread", false, [["Regular", 250, { "Garlic bread": 1 }]]); item("Sides", "Fries", false, [["Regular", 200, { "Potato fries": 150 }], ["Large", 300, { "Potato fries": 250 }]]);
  item("Drinks", "Cola 345ml", false, [["Regular", 100, { "Cola 345ml": 1 }]]); item("Drinks", "Water", false, [["Regular", 60, { "Water bottle": 1 }]]);
  [["Extra cheese", 150, "Mozzarella cheese", 50], ["Olives", 80, "Olives", 20], ["Jalapenos", 80, "Jalapenos", 20]].forEach(([name, price, ing, q]) => { const id = s.id.addon++; s.addons.push({ id, name, price }); s.arec[id] = { [ING[ing]]: q }; });
  S = s;                                         // helpers below read S
  const dayCount = {}, names = ["Sara Ahmed", "Usman Ali", "Maria Khan", "Daniyal Shah", "Ayesha Noor", "Hamza Iqbal"];
  const mk = (ts, shiftId, user) => {
    const lines = []; const n = wpick([1, 2, 3, 4], [5, 4, 2, 1]);
    for (let i = 0; i < n; i++) { const cat = wpick(["Pizza", "Sides", "Drinks"], [6, 2, 2]); const it = pick(S.menu.filter(m => m.cat === cat)); const v = pick(it.variants);
      const ads = it.addons ? S.addons.filter(() => R() < .25).map(a => a.id) : []; lines.push({ vid: v.id, qty: wpick([1, 2, 3], [9, 2, 1]), addons: ads, note: "" }); }
    const pct = wpick([0, 5, 10], [8, 1, 1]), t = calc(lines, "percent", pct), type = wpick(Object.keys(TYPES), [5, 3, 2]), mode = wpick(["cash", "card", "online", "split"], [55, 22, 15, 8]);
    let pay; if (mode === "cash") pay = { cash: t.total, card: 0, online: 0 }; else if (mode === "card") pay = { cash: 0, card: t.total, online: 0 }; else if (mode === "online") pay = { cash: 0, card: 0, online: t.total };
    else { const c = Math.round(t.total / 2); pay = { cash: r2(t.total - c), card: c, online: 0 }; }
    const k = dKey(ts); dayCount[k] = (dayCount[k] || 0) + 1;
    S.orders.push({ id: S.id.order++, no: dayCount[k], ts, user, shiftId, type, table: type === "dine_in" ? String(1 + Math.floor(R() * 12)) : "", name: type !== "dine_in" ? pick(names) : "", phone: "", addr: type === "delivery" ? "House " + (1 + Math.floor(R() * 60)) + ", Street " + (1 + Math.floor(R() * 20)) : "",
      note: "", items: t.items, subtotal: t.subtotal, discount: t.discount, tax: t.tax, total: t.total, status: "paid", pay, refund: null });
  };
  for (let d = 7; d >= 1; d--) {
    const base0 = today0 - d * DAY;
    [["Ahmed Khan", 11.5, 6, 5000, 5 + Math.floor(R() * 4)], ["Hina Malik", 17.5, 5, 6000, 8 + Math.floor(R() * 6)]].forEach(([user, startH, hours, opening, n], idx) => {
      const sh = { id: S.id.shift++, user, openedAt: base0 + startH * 36e5, opening, closedAt: null, counted: null, expected: null, diff: null }; S.shifts.push(sh);
      const step = hours * 60 / (n + 1); let t = sh.openedAt;
      for (let i = 0; i < n; i++) { t += (step * (.5 + R() * .5)) * 6e4; mk(t, sh.id, user); }
      const cash = S.orders.filter(o => o.shiftId === sh.id).reduce((a, o) => a + o.pay.cash, 0);
      sh.closedAt = t + 10 * 6e4; sh.expected = r2(opening + cash); sh.counted = r2(sh.expected + (d === 1 && idx === 1 ? -150 : pick([0, 0, 0, 0, -50, 100]))); sh.diff = r2(sh.counted - sh.expected);
      S.audit.push({ ts: sh.openedAt, who: user, action: "shift_open", detail: "opening balance " + opening }, { ts: sh.closedAt, who: user, action: "shift_close", detail: "expected " + sh.expected + " counted " + sh.counted + " difference " + sh.diff });
    });
    if (d === 4) { const o = S.orders.filter(x => isoDay(x.ts) === isoDay(base0))[2]; if (o) { o.status = "refunded"; o.refund = { ts: base0 + 21 * 36e5, user: "Bilal Raza", reason: "Customer complaint, wrong topping", shiftId: null }; S.audit.push({ ts: o.refund.ts, who: "Bilal Raza", action: "refund", detail: orderCode(o) + " total " + o.total }); } }
  }
  // today: Hina's shift is open with a few orders so the dashboard is alive

function findVariant(vid) { for (const it of S.menu) { const v = it.variants.find(x => x.id === vid); if (v) return { it, v }; } return null; }
function usage(vid, addonIds, qty) { const u = {}; Object.entries(S.rec[vid] || {}).forEach(([i, q]) => u[i] = (u[i] || 0) + q * qty); addonIds.forEach(a => Object.entries(S.arec[a] || {}).forEach(([i, q]) => u[i] = (u[i] || 0) + q * qty)); return u; }

function calc(lines, dtype, dval) {
  const items = lines.map(l => { const { it, v } = findVariant(l.vid); const ads = (l.addons || []).map(id => S.addons.find(a => a.id === id)).filter(Boolean);
    return { vid: v.id, name: it.name + (v.label === "Regular" ? "" : " (" + v.label + ")"), cat: it.cat, qty: l.qty, unit: v.price + ads.reduce((s, a) => s + a.price, 0), addons: ads.map(a => ({ id: a.id, name: a.name, price: a.price })), note: l.note || "", cost: costOf(v.id, ads.map(a => a.id)) }; });
  const subtotal = r2(items.reduce((s, i) => s + i.unit * i.qty, 0)); let d = dtype === "percent" ? subtotal * (+dval || 0) / 100 : +dval || 0; const discount = r2(Math.min(Math.max(d, 0), subtotal));

  $("#app").innerHTML = `<div class="demo"><span>Live demo · sample data · no login needed · everything is saved in your browser only</span><button data-act="reset">Reset demo</button></div>
    <header class="top"><span class="brand">${esc(S.settings.shop)}</span><div class="roles"><span>View as</span>${Object.entries(S.roles).map(([k, r]) => `<button data-act="role" data-v="${k}" class="${k === S.role ? "on" : ""}">${esc(r.name)}</button>`).join("")}</div><span class="who">${esc(me())}</span></header>
    <nav class="nav">${nav.map(n => `<button data-act="nav" data-v="${n[0]}" class="${ui.view === n[0] ? "on" : ""}">${n[1]}</button>`).join("")}</nav>${body}`;
  if (ui.view === "pos" && $("#grid")) { drawShiftbar(); drawMenu(); drawCust(); drawCart(); }
}
const A = {
  nav: el => { ui.view = el.dataset.v; render(); window.scrollTo(0, 0); },
  role: el => { S.role = el.dataset.v; ui.view = null; ui.cart = []; save(); render(); toast("Now viewing as " + role().name); },
  reset: () => { if (confirm("Reset the demo to its original sample data?")) { try { localStorage.removeItem(KEY); } catch (e) { } memory = null; ui = Object.assign(ui, { view: null, cart: [] }); load(); render(); toast("Demo reset."); } },
  closeModal: hideModal, print: () => window.print(),
  cat: el => { ui.cat = el.dataset.v; drawMenu(); },
  item: el => openItem(+el.dataset.v),
  type: el => { ui.type = el.dataset.v; $("#types").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === ui.type)); drawCust(); },
  qty: el => { const l = ui.cart[+el.dataset.i]; l.qty = Math.min(99, l.qty + +el.dataset.d); if (l.qty < 1) ui.cart.splice(+el.dataset.i, 1); drawCart(); },
  del: el => { ui.cart.splice(+el.dataset.i, 1); drawCart(); },
  clear: () => { if (!ui.cart.length || confirm("Clear this order?")) { ui.cart = []; ui.heldId = null; drawCart(); } },
  pay: openPay,
  hold: () => { if (!ui.cart.length) return; const label = prompt("Name for this held order (table, customer...)", ui.table ? "Table " + ui.table : ui.name || ""); if (label === null) return;
    S.held.push({ id: Date.now(), user: me(), label: label || "Held order", ts: Date.now(), cart: JSON.parse(JSON.stringify(ui.cart)), f: { type: ui.type, table: ui.table, name: ui.name, phone: ui.phone, addr: ui.addr, note: ui.note, dtype: ui.dtype, dval: ui.dval } }); ui.cart = []; save(); render(); toast("Order held."); },
  held: () => { const list = S.held.filter(h => h.user === me()); showModal(`<h3>Held orders</h3>${list.map(h => `<div class="heldrow"><div><b>${esc(h.label)}</b><br><small class="muted">${hm(h.ts)} · ${h.cart.length} lines</small></div><div><button class="btn small primary" data-act="resume" data-v="${h.id}">Resume</button> <button class="btn small danger" data-act="delHeld" data-v="${h.id}">Delete</button></div></div>`).join("") || '<p class="muted">No held orders.</p>'}<div class="actions"><button class="btn" data-act="closeModal">Close</button></div>`); },
  resume: el => { const h = S.held.find(x => x.id === +el.dataset.v); if (!h) return; if (ui.cart.length && !confirm("Replace the current order?")) return; ui.cart = h.cart; Object.assign(ui, h.f); ui.heldId = h.id; hideModal(); render(); },
  delHeld: el => { S.held = S.held.filter(h => h.id !== +el.dataset.v); save(); render(); A.held(); },
  openShift: () => { const v = parseFloat($("#open-bal").value); if (!(v >= 0)) { toast("Enter the opening cash (0 or more)."); return; } S.shifts.push({ id: S.id.shift++, user: me(), openedAt: Date.now(), opening: v, closedAt: null, counted: null, expected: null, diff: null }); audit("shift_open", "opening balance " + v); save(); ui.view = "pos"; render(); },
  goShift: () => { ui.view = "shift"; render(); },
  closeShift: () => { const sh = openShift(), c = parseFloat($("#counted").value); if (!sh || !(c >= 0)) { toast("Count the cash in the drawer and enter it."); return; } const s = shiftSummary(sh);
    sh.closedAt = Date.now(); sh.counted = c; sh.expected = s.expected; sh.diff = r2(c - s.expected); sh.note = $("#close-note").value.trim(); audit("shift_close", "expected " + s.expected + " counted " + c + " difference " + sh.diff); save(); ui.shiftId = sh.id; ui.view = "shiftreport"; render(); },
  report: el => { ui.shiftId = +el.dataset.v; ui.view = "shiftreport"; render(); window.scrollTo(0, 0); },
  order: el => openOrder(+el.dataset.v),
  receipt: el => showReceipt(S.orders.find(o => o.id === +el.dataset.v), false),
  csv: () => { const d1 = ui.from || isoDay(Date.now() - 6 * DAY), d2 = ui.to || isoDay(Date.now()); const rows = [["Order", "Date", "Cashier", "Type", "Customer", "Subtotal", "Discount", "Tax", "Total", "Status"]].concat(S.orders.filter(o => isoDay(o.ts) >= d1 && isoDay(o.ts) <= d2).map(o => [orderCode(o), stamp(o.ts), o.user, TYPES[o.type], o.name, o.subtotal, o.discount, o.tax, o.total, o.status]));
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([rows.map(r => r.map(c => '"' + String(c ?? "").replace(/"/g, '""') + '"').join(",")).join("\n")], { type: "text/csv" })); a.download = `orders-${d1}-to-${d2}.csv`; a.click(); },
  addItem: () => { const cat = $("#n-cat").value.trim(), name = $("#n-name").value.trim(), vars = $("#n-vars").value.split(",").map(p => p.split(":")).filter(p => p.length === 2 && p[0].trim() && +p[1] >= 0 && p[1].trim() !== "");
    if (!cat || !name || !vars.length) { toast("Enter a category, a name and sizes like Small:650, Large:1200"); return; } S.menu.push({ id: S.id.item++, cat, name, addons: $("#n-add").checked, active: true, variants: vars.map(p => { const v = { id: S.id.v++, label: p[0].trim(), price: +p[1] }; S.rec[v.id] = {}; return v; }) }); audit("menu_add", name); save(); render(); toast("Item added."); },
  toggleItem: el => { S.menu.find(m => m.id === +el.dataset.v).active = el.checked; save(); render(); },
  recipe: el => openRecipe("v", +el.dataset.v), arecipe: el => openRecipe("a", +el.dataset.v),
  stockIn: () => { const i = S.ing.find(x => x.id === +$("#in-ing").value), q = +$("#in-qty").value; if (!(q > 0)) { toast("Quantity must be more than zero."); return; } i.stock = r2(i.stock + q); if (+$("#in-cost").value > 0) i.cost = +$("#in-cost").value;
    S.log.push({ ts: Date.now(), ing: i.name, change: q, reason: "purchase", by: me() }); audit("stock_in", i.name + " +" + q); save(); render(); toast("Stock updated."); },
  waste: () => { const i = S.ing.find(x => x.id === +$("#w-ing").value), q = +$("#w-qty").value; if (!(q > 0)) { toast("Quantity must be more than zero."); return; } i.stock = r2(i.stock - q); S.log.push({ ts: Date.now(), ing: i.name, change: -q, reason: "wastage " + $("#w-reason").value, by: me() }); audit("wastage", i.name + " -" + q); save(); render(); toast("Wastage recorded."); },
  count: () => { const i = S.ing.find(x => x.id === +$("#c-ing").value), q = parseFloat($("#c-qty").value); if (!(q >= 0)) { toast("Enter the counted quantity."); return; } const d = r2(q - i.stock); if (d) S.log.push({ ts: Date.now(), ing: i.name, change: d, reason: "stock count", by: me() }); i.stock = q; audit("stock_count", i.name + " -> " + q); save(); render(); toast("Stock updated."); },
  addRole: () => { const n = $("#role-name").value.trim(); if (!n) { toast("Enter a role name."); return; } const k = "r" + Date.now(); S.roles[k] = { name: n, user: n + " (demo user)", perms: CASHIER.slice() }; audit("role_add", n); save(); render(); },
  delRole: el => { const k = el.dataset.v; if (S.role === k) S.role = "owner"; delete S.roles[k]; save(); render(); }
};
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (!el || el.matches("input,select")) { if (e.target.id === "modal") hideModal(); return; } if (el.tagName === "A") e.preventDefault(); A[el.dataset.act]?.(el, e); });
document.addEventListener("change", e => { const t = e.target;
  if (t.dataset.act === "toggleItem") A.toggleItem(t);
  else if (t.dataset.act === "price") { const f = findVariant(+t.dataset.v); audit("price_change", f.it.name + " (" + f.v.label + "): " + f.v.price + " -> " + t.value); f.v.price = +t.value || 0; save(); toast("Price saved."); }
  else if (t.dataset.act === "aprice") { S.addons.find(a => a.id === +t.dataset.v).price = +t.value || 0; save(); toast("Price saved."); }
  else if (t.dataset.act === "perm") { const r = S.roles[t.dataset.role]; r.perms = t.checked ? [...new Set(r.perms.concat(t.dataset.p))] : r.perms.filter(p => p !== t.dataset.p); audit("role_perms", r.name + ": " + r.perms.join(", ")); save(); toast("Token saved for " + r.name + "."); }
  else if (t.dataset.set) { const k = t.dataset.set; S.settings[k] = t.type === "checkbox" ? t.checked : t.type === "number" ? +t.value : t.value; save(); if (k === "shop") render(); }
  else if (t.id === "ofrom" || t.id === "oto" || t.id === "ostatus") { ui.ofrom = $("#ofrom")?.value || null; ui.oto = $("#oto")?.value || null; ui.ostatus = $("#ostatus").value; render(); }
  else if (t.id === "rfrom" || t.id === "rto") { ui.from = $("#rfrom").value; ui.to = $("#rto").value; render(); } });
document.addEventListener("input", e => { const t = e.target;
  if (t.id === "search") { ui.search = t.value; drawMenu(); } else if (t.id === "f-note") ui.note = t.value; else if (t.dataset.k) ui[t.dataset.k] = t.value;
  else if (t.id === "dval" || t.id === "dtype") { ui.dval = $("#dval").value; ui.dtype = $("#dtype").value; drawCart(); }
  else if (t.id === "oq") { ui.oq = t.value; const p = t.selectionStart; render(); const n = $("#oq"); n.focus(); n.setSelectionRange(p, p); } });
document.addEventListener("keydown", e => { if (e.key === "Escape") hideModal(); });
load(); render();
})();
